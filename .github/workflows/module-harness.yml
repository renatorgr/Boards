# Module harness check.
# Builds the real sprayer and seed drill programs (Sprayer/Sprayer_ESP32, Seeder/Seeder_ESP32) for the PC, once per
# board, and runs Tests/ESP32_Modules: five kinds of user (careful, never set up, wrong settings, wrong slots, a bad
# network) against each board, checking what the relays really do. A failing "must" check that known-bugs.txt does not
# list fails the run; the report goes in the run's summary and as a download. Plain g++ with 32-bit support, no packages.
# Licence: GNU General Public License v3 or later (Firmware/v4.5_AiO_WEB/COPYING).
# SPDX-License-Identifier: GPL-3.0-or-later

name: Module harness

on:
  pull_request:
    paths:
      - 'Sprayer/Sprayer_ESP32/**'
      - '!Sprayer/**/*.md'
      - 'Seeder/Seeder_ESP32/**'
      - '!Seeder/**/*.md'
      - 'Tests/ESP32_Modules/**'
      - '!Tests/**/*.md'
      - '.github/workflows/module-harness.yml'
  push:
    branches: [main]
    paths:
      - 'Sprayer/Sprayer_ESP32/**'
      - '!Sprayer/**/*.md'
      - 'Seeder/Seeder_ESP32/**'
      - '!Seeder/**/*.md'
      - 'Tests/ESP32_Modules/**'
      - '!Tests/**/*.md'
      - '.github/workflows/module-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  users:
    name: users
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the 32-bit compiler support
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-multilib

      - name: Build the programs for the PC and run the users
        run: Tests/ESP32_Modules/run.sh

      - name: Report in the summary
        if: always()
        run: cat Tests/ESP32_Modules/build/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-harness-report
          path: Tests/ESP32_Modules/build/report.md
          if-no-files-found: ignore
