# Web page simulator: build, check, publish.
# On every change to the firmware, builds the simulator of the modules' web pages (Firmware/simulator: the
# real pages from zWebPage.h, xPage.h, the seed drill module's dPage.h and the sprayer module's sPage.h with
# pretend modules behind them),
# opens it in a browser as a check, and on main publishes it on GitHub Pages at https://renatorgr.github.io/Boards/.
# GitHub Pages must be switched on once by hand: repository Settings → Pages → Source "GitHub Actions".
# Licence: GNU General Public License v3 or later (Firmware/v4.5_AiO_WEB/COPYING).
# SPDX-License-Identifier: GPL-3.0-or-later

name: Web page simulator

on:
  pull_request:
    paths:
      - 'Firmware/**'
      - '!Firmware/**/*.md'
      - '!Firmware/**/*.png'
      - 'Sprayer/Sprayer_ESP32/**'
      - '!Sprayer/**/*.md'
      - 'Seeder/Seeder_ESP32/**'
      - '!Seeder/**/*.md'
      - '.github/workflows/simulator.yml'
  push:
    branches: [main]
    paths:
      - 'Firmware/**'
      - '!Firmware/**/*.md'
      - '!Firmware/**/*.png'
      - 'Sprayer/Sprayer_ESP32/**'
      - '!Sprayer/**/*.md'
      - 'Seeder/Seeder_ESP32/**'
      - '!Seeder/**/*.md'
      - '.github/workflows/simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT: '1.63.0'   # the browser driver of the check; its Chromium comes with it

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # a build and check take about 4 minutes; a stuck browser must not hold the queue for hours
    # a newer push to the same branch replaces the check of the older one; each branch has its own queue
    concurrency:
      group: simulator-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Build the simulator
        run: python3 Firmware/simulator/build.py _site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser for the check
        run: |
          npm install --no-save --no-package-lock "playwright@$PLAYWRIGHT"
          npx playwright install --with-deps chromium

      - name: Open the pages in a browser
        timeout-minutes: 8
        run: node Firmware/simulator/smoke-test.js _site shots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Simulator built and checked"
            echo
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "The pages open without errors. Published only once merged into main."
            else
              echo "The pages open without errors; the **deploy** job publishes them at https://renatorgr.github.io/Boards/."
            fi
            echo
            echo "Screenshots of every tab: **Artifacts** on this page."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to publish
      id-token: write   # Pages checks that the publication comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one publication at a time, and the one under way finishes (GitHub Pages takes one deployment at a time)
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # fails with "Get Pages site failed" until Pages is switched on: Settings → Pages → Source "GitHub Actions"
